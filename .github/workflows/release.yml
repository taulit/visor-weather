name: Release

# Push a tag such as v1.0.0 to build the ZIP and attach it to a GitHub release.
# Uploading to extensions.gnome.org is a manual step.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install system packages
        run: sudo apt-get install -y libglib2.0-bin gettext zip
      - run: pnpm install
      - run: pnpm pack:zip
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
